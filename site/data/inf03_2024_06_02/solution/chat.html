<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Chat</title>
<link rel="stylesheet" href="styl.css">
</head>
<body>
<header><h2>Chat</h2></header>
<aside>
<h3>Chaty</h3>
<ul>
<li>Ogólny</li>
<li>Tematyczne
<ol>
<li>Turystyczny</li>
<li>Żeglarski</li>
<li>Filatelistyczny</li>
<li>Hodowla zwierzątek domowych</li>
</ol>
</li>
</ul>
<h3>Uczestnicy</h3>
<p>Jolanta Nowak</p>
<img src="Jolka.jpg" alt="Jolanta Nowak">
<p>Krzysztof Łukasiński</p>
<img src="Krzysiek.jpg" alt="Krzysztof Łukasiński">
</aside>
<main>
<div id="chat">
<div class="wypowiedz jolka"><img src="Jolka.jpg" alt="Jolanta Nowak"><p>Cześć idziesz jutro do kina?</p></div>
<div class="wypowiedz krzysiek"><img src="Krzysiek.jpg" alt="Krzysztof Łukasiński"><p>Tak! A ty?</p></div>
</div>
<label for="wiadomosc">Wpisz wiadomość:</label>
<input type="text" id="wiadomosc"> <button onclick="wyslijWiadomosc()">Wyślij</button>
<br>
<button onclick="generujLosowaOdpowiedz()">Generuj losową odpowiedź</button>
</main>
<footer><h5>Chat wykonał: 00000000000</h5></footer>
<script>
var odpowiedziKrzysztofa = [
"Świetnie!",
"Kto gra główną rolę?",
"Lubisz filmy Tego reżysera?",
"Będę 10 minut wcześniej",
"Może kupimy sobie popcorn?",
"Ja wolę Colę",
"Zaproszę jeszcze Grześka",
"Tydzień temu też byłem w kinie na Diunie",
"Ja funduję bilety"
];

function dodajWypowiedz(klasaAutora, plikObrazu, tekstAlternatywny, tekst) {
    var oknoChatu = document.getElementById("chat");
    var blokWypowiedzi = document.createElement("div");
    blokWypowiedzi.classList.add("wypowiedz");
    blokWypowiedzi.classList.add(klasaAutora);
    var obraz = document.createElement("img");
    obraz.src = plikObrazu;
    obraz.alt = tekstAlternatywny;
    var akapit = document.createElement("p");
    akapit.innerText = tekst;
    blokWypowiedzi.appendChild(obraz);
    blokWypowiedzi.appendChild(akapit);
    oknoChatu.appendChild(blokWypowiedzi);
    blokWypowiedzi.scrollIntoView();
}

function wyslijWiadomosc() {
    var poleWiadomosci = document.getElementById("wiadomosc");
    dodajWypowiedz("jolka", "Jolka.jpg", "Jolanta Nowak", poleWiadomosci.value);
}

function generujLosowaOdpowiedz() {
    var indeks = Math.floor(Math.random() * 9);
    dodajWypowiedz("krzysiek", "Krzysiek.jpg", "Krzysztof Łukasiński", odpowiedziKrzysztofa[indeks]);
}
</script>
</body>
</html>
