<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Montaż paneli podłogowych</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header><img src="montaz_paneli.png" alt="firma usługowa"></header>
<nav>
<a href="index.html">Strona Główna</a>
<a href="oferta.html">Oferta</a>
<a href="koszty.html">Kalkulator kosztów</a>
</nav>
<main>
<h1>Kalkulator kosztów montażu</h1>
<label for="szerokosc">Szerokość pomieszczenia [m]: </label><input type="number" id="szerokosc">
<label for="dlugosc">Długość pomieszczenia [m]: </label><input type="number" id="dlugosc">
<p>Typ panelu</p>
<input type="radio" name="typ" id="laminowane" value="12"><label for="laminowane">Panele laminowane</label><br>
<input type="radio" name="typ" id="winylowe" value="14"><label for="winylowe">Panele winylowe</label><br>
<input type="radio" name="typ" id="deska" value="18"><label for="deska">Deska podłogowa</label><br>
<button onclick="oblicz()">Oblicz</button>
<p id="wynik"></p>
<script>
function oblicz() {
    var szerokosc = parseFloat(document.getElementById("szerokosc").value);
    var dlugosc = parseFloat(document.getElementById("dlugosc").value);
    var typ = document.querySelector('input[name="typ"]:checked');
    var wynik = document.getElementById("wynik");
    if (!isNaN(szerokosc) && !isNaN(dlugosc) && typ) {
        var pole = szerokosc * dlugosc;
        var koszt = pole * parseFloat(typ.value);
        wynik.innerHTML = "Pole powierzchni pomieszczenia: " + pole + ", koszt montażu " + koszt;
    } else {
        wynik.innerHTML = "Wprowadź poprawne dane.";
    }
}
</script>
</main>
<footer><h5>Autor strony: 00000000000</h5></footer>
</body>
</html>
