<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Biuro turystyczne</title>

</head>
<body>
<header><h1>Rezerwacja wycieczek</h1></header>
<main>
<nav>
<button id="uczestnik" onclick="funkcjaUczestnika()">Uczestnik</button><button id="rezerwacja" onclick="funkcjaRezerwacji()">Rezerwacja</button>
</nav>
<aside><img src="1.jpg" alt="wycieczki"><img src="2.jpg" alt="wycieczki"><img src="3.jpg" alt="wycieczki"><img src="1.jpg" alt="wycieczki"><img src="2.jpg" alt="wycieczki"><img src="3.jpg" alt="wycieczki"><img src="1.jpg" alt="wycieczki"><img src="2.jpg" alt="wycieczki"><img src="3.jpg" alt="wycieczki"></aside>
<section id="klient">
<h2>Dane Klienta</h2>
<img src="osoba.png" alt="Klient"><br>
<label for="imie">Imię</label> <input type="text" id="imie"><br>
<label for="nazwisko">Nazwisko</label> <input type="text" id="nazwisko">
<p><a href="wycieczki.html">Do strony głównej</a></p>
</section>
<section id="rezerwacje">
<h2>Dane rezerwacji</h2>
<span onclick="poprzedniaWycieczka()">&laquo;</span>
<img src="1.jpg" alt="wycieczka" id="zdjecie">
<span onclick="nastepnaWycieczka()">&raquo;</span>
<h4 id="miejsce">Barcelona</h4>
<label for="liczba">Liczba osób:</label> <input type="number" id="liczba" min="1" max="4" value="2" disabled><br>
<label for="wylot">Miejsce wylotu:</label> <select id="wylot" disabled><option>Warszawa</option><option>Kraków</option><option>Wrocław</option></select><br>
<input type="radio" name="wyzywienie" id="r1" checked disabled><label for="r1">Śniadania</label>
<input type="radio" name="wyzywienie" id="r2" disabled><label for="r2">Śniadania i obiadokolacje</label>
<input type="radio" name="wyzywienie" id="r3" disabled><label for="r3">All inclusive</label><br>
<button disabled id="cena">Sprawdź cenę</button>
</section>
</main>
<footer><p>Autor strony: <em>00000000000</em></p></footer>
