<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>malarz</title>
    <link rel="stylesheet" href="styl_1.css">
</head>
<body>
    <header>
        <h1>Malowanie pokoi i biur</h1>
    </header>
    <aside>
        <h2>Menu</h2>
        <ul>
            <li><a href="mieszamy.html">Mieszamy</a></li>
            <li><a href="cena.html">Wyceniamy</a></li>
        </ul>
    </aside>
    <main>
        <h2>Zapotrzebowanie na farbę</h2>
        <label for="powierzchnia">Powierzchnia malowania (m<sup>2</sup>):</label>
        <input type="number" id="powierzchnia">
        <button onclick="policz()">Policz</button>
        <p id="wynik"></p>
    </main>
    <aside>
        <img src="obraz.png" alt="Próbki farb">
    </aside>
    <footer>
        <h3>MALARZ</h3>
        <p>Stronę opracował: 00000000000</p>
    </footer>
    <script>
        function policz() {
            var powierzchnia = document.getElementById("powierzchnia").value;
            var puszki = Math.ceil(powierzchnia / 4);
            document.getElementById("wynik").innerHTML = "Liczba potrzebnych puszek: " + puszki;
        }
    </script>
</body>
</html>
