<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Fryzjerstwo</title>
    <link rel="stylesheet" href="styl8.css">
</head>
<body>
    <section id="lewy1"><h1><a href="index.html">SALON FRYZJERSKI</a></h1></section>
    <section id="prawy1">
        <h4><a href="fryzura.html">Ceny strzyżenia</a></h4>
        <table>
            <tr><th>Długość włosów</th><th>Cena</th></tr>
            <tr><td>Krótkie</td><td>25</td></tr>
            <tr><td>Średnie</td><td>30</td></tr>
            <tr><td>Półdługie</td><td>40</td></tr>
            <tr><td>Długie</td><td>50</td></tr>
        </table>
    </section>
    <section id="lewy2">
        <h2>PROMOCJA!</h2>
        <input type="radio" name="dlugosc" value="25">Krótkie<br>
        <input type="radio" name="dlugosc" value="30">Średnie<br>
        <input type="radio" name="dlugosc" value="40">Półdługie<br>
        <input type="radio" name="dlugosc" value="50">Długie<br>
        <button onclick="odkryjPromocje()">Odkryj promocję</button>
        <p id="wynik"></p>
    </section>
    <section id="prawy2"><img src="obraz1.jpg" alt="Fryzjerka"></section>
    <section id="lewy3">
        <p>Witaj! Miło nam, że odwiedziłeś nasz salon. Sprawdź promocje!</p>
        <h4>Kontakt: 444 555 666</h4>
    </section>
    <footer><p>Autor: 00000000000</p></footer>
    <script>
        function odkryjPromocje() {
            var opcje = document.getElementsByName("dlugosc");
            for (var i = 0; i < opcje.length; i++) {
                if (opcje[i].checked) {
                    var cenaPromocyjna = Number(opcje[i].value) - 10;
                    document.getElementById("wynik").innerHTML = "cena promocyjna: " + cenaPromocyjna;
                }
            }
        }
    </script>
</body>
</html>
