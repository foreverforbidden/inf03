<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Tatuaże</title>
<link rel="stylesheet" href="styl.css">
</head>
<body>
<header id="baner1"><img src="logo.png" alt="salon"></header>
<header id="baner2"><h1>Studio Tatuażu</h1></header>
<section id="galeria">
<h2>Galeria</h2>
<img src="smok.png" alt="smok.png" class="miniatura">
<img src="koliber.png" alt="koliber.png" class="miniatura">
</section>
<aside>
<h3>Dodaj wzór</h3>
<label for="plik">Wzór:</label><br>
<input type="file" id="plik" accept="image/png"><br>
<label for="kolor">Kolor:</label><br>
<select id="kolor">
<option>Czarny</option>
<option>Czerwony</option>
<option>Zielony</option>
<option>Niebieski</option>
</select><br>
<label for="cena">Cena:</label><br>
<input type="number" id="cena"><br>
<button type="button" onclick="dodajWzor()">Dodaj Wzór</button>
</aside>
<footer><p>Autor strony: 00000000000</p></footer>
<script>
function dodajWzor() {
    var sciezka = document.getElementById("plik").value;
    var kolor = document.getElementById("kolor").value;
    var cena = document.getElementById("cena").value;
    var nazwaPliku = sciezka.substring(sciezka.lastIndexOf("\\") + 1);
    alert("Wzór: " + nazwaPliku + ", kolor " + kolor + " w cenie " + cena + " zł");
    var obraz = document.createElement("img");
    obraz.src = nazwaPliku;
    obraz.alt = nazwaPliku;
    obraz.className = "miniatura";
    document.getElementById("galeria").appendChild(obraz);
}
</script>
</body>
</html>
